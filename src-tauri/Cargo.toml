[package]
name = "marq"
version = "0.1.0"
description = "Markdown knowledge base with Claude sessions and mq"
authors = ["Takahiro Sato"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "marq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mq-lang = "0.9.3"
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "macros", "time"] }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
walkdir = "2"
glob = "0.3"
regex = "1"
thiserror = "2"
dirs = "6"
yaml-rust2 = "0.13"
trash = "5"
portable-pty = "0.9.0"
toml = "1.1.8"
toml_edit = "0.25"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
