[book]
authors = ["Takahiro Sato"]
description = "Marq documentation: a Markdown knowledge base and an IDE for coding agents."
language = "en"
src = "docs"
title = "Marq Documentation"

[build]
build-dir = "site/book"

[output.html]
additional-css = ["mdbook/theme/custom.css"]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/harehare/marq"
edit-url-template = "https://github.com/harehare/marq/edit/main/{path}"
site-url = "/book/"
smart-punctuation = true

[output.html.search]
limit-results = 20
