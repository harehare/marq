name: Deploy site

# Landing page (site/) and the mdBook docs (site/book/) on GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - book.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build
        env:
          # Project pages are served under /marq/
          MDBOOK_OUTPUT__HTML__SITE_URL: /marq/book/
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
